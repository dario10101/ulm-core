# TEMPORAL (PLAN-DEPLOY fase 5.6): prueba que GitHub Actions entra a GCP como
# ulm-deployer via Workload Identity Federation, sin claves. Solo manual.
# Desde main tiene que pasar; desde otra rama, fallar en `auth`. Borrar al
# terminar la fase 5.
name: WIF check

on: workflow_dispatch

permissions:
  contents: read
  id-token: write # sin esto GitHub no emite el token OIDC

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Quien soy
        run: gcloud auth list --filter=status:ACTIVE --format="value(account)"
      - name: Lee el servicio (run.developer)
        run: gcloud run services describe ulm-core --project=${{ vars.GCP_PROJECT }} --region=${{ vars.GCP_REGION }} --format="value(status.url)"
      - name: Lee el Job de migraciones (run.developer)
        run: gcloud run jobs describe ulm-migrate --project=${{ vars.GCP_PROJECT }} --region=${{ vars.GCP_REGION }} --format="value(metadata.name)"
      - name: Lista imagenes (artifactregistry)
        run: gcloud artifacts docker images list ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/ulm --limit=3
