name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # Redeploy manual de main sin commit nuevo (Actions -> CI -> Run workflow).
  workflow_dispatch:

# Minimo por defecto; el job deploy agrega id-token para WIF.
permissions:
  contents: read

jobs:
  # Linter y formato: fallan rapido y sin base de datos.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: ruff (lint)
        run: ruff check .
      - name: ruff (formato)
        run: ruff format --check .

  # Suite sobre SQLite en memoria: es la que corre en cada push, rapida.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  # Postgres real: es lo unico que atrapa las divergencias con SQLite, que en
  # este proyecto ya mordieron dos veces (create_all que no altera columnas, y
  # SAVEPOINT roto en pysqlite). Ademas verifica que las migraciones levanten
  # el esquema desde cero y que ningun modelo haya quedado sin su migracion.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ulm_user
          POSTGRES_PASSWORD: ulm_password
          POSTGRES_DB: ulm_db
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg2://ulm_user:ulm_password@localhost:5432/ulm_db
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Migraciones desde cero
        run: alembic upgrade head
      - name: Sin drift entre modelos y esquema
        run: alembic check
      # alembic check no compara nombres (PK, FK, indices, secuencias): un
      # renombre de tabla mal hecho pasa sin aviso. Este script si los compara.
      - name: Sin drift de nombres
        run: python -m scripts.check_db_names
      - name: Downgrade reversible
        run: alembic downgrade base
      - name: Upgrade despues del downgrade
        run: alembic upgrade head

  # La imagen de produccion (Dockerfile): que construya,
  # que migre una base vacia y que la API arranque. --network host: el
  # contenedor ve el Postgres del service en localhost. El push lo hace deploy.
  docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ulm_user
          POSTGRES_PASSWORD: ulm_password
          POSTGRES_DB: ulm_db
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg2://ulm_user:ulm_password@localhost:5432/ulm_db
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t ulm-core:ci .
      - name: No corre como root
        run: test "$(docker run --rm ulm-core:ci whoami)" = "ulm"
      - name: Migraciones con la imagen
        run: docker run --rm --network host -e DATABASE_URL ulm-core:ci alembic upgrade head
      - name: Smoke test de la API
        run: |
          docker run -d --name api --network host -e DATABASE_URL ulm-core:ci
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8000/api/v1/health && exit 0
            sleep 2
          done
          docker logs api
          exit 1

  # Deploy a produccion (PLAN-DEPLOY fase 6): solo main, despues de los 4
  # checks. Entra a GCP como ulm-deployer por Workload Identity Federation
  # (sin claves; el provider solo acepta este repo en refs/heads/main).
  # Solo cambia la imagen: env vars, secretos y escalado de Cloud Run quedan
  # como estaban (la config se cambia a mano desde ulm-infra).
  deploy:
    needs: [lint, tests, postgres, docker]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # Dos pushes seguidos se encolan; nunca cortar un deploy entre la
    # migracion y el deploy de la API.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      REGION: ${{ vars.GCP_REGION }}
      PROJECT: ${{ vars.GCP_PROJECT }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/ulm/ulm-core:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build y push
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --build-arg GIT_SHA=${{ github.sha }} -t "$IMAGE" .
          docker push "$IMAGE"
      # Antes que la API: si la migracion falla, sigue sirviendo la revision
      # anterior. Las migraciones tienen que ser compatibles con el codigo
      # anterior (expand/contract), porque la API vieja corre un rato contra
      # la base nueva.
      - name: Migraciones
        run: |
          gcloud run jobs update ulm-migrate --image="$IMAGE" --region="$REGION" --project="$PROJECT" --quiet
          gcloud run jobs execute ulm-migrate --wait --region="$REGION" --project="$PROJECT"
      - name: Deploy de la API
        run: gcloud run deploy ulm-core --image="$IMAGE" --region="$REGION" --project="$PROJECT" --quiet
      # Por getulm.app y no por *.run.app: prueba la cadena real (Cloudflare,
      # proxy, Cloud Run, app). El SHA confirma que responde la revision nueva.
      # Reintenta ~1 min por el arranque en frio de Cloud Run y Neon.
      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            body=$(curl -fsS https://getulm.app/api/v1/health || true)
            if echo "$body" | grep -q '"${{ github.sha }}"'; then echo "$body"; exit 0; fi
            sleep 6
          done
          echo "getulm.app no devuelve la version ${{ github.sha }}: $body"
          exit 1
      - name: Resumen
        if: always()
        run: echo "Imagen \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
